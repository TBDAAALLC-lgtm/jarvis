<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#01060c" />

    <!--
      Defence in depth behind the sanitiser in src/ui/Panels.tsx.

      Panel markup is written by a model that has just been reading the open
      web, so the thing worth pinning down is `img-src`: a single
      `<img src="https://…">` is a working beacon that reports this machine's
      address to a host of the page author's choosing, and it needs no script to
      fire.

      JARVIS now shows images and video he found on the web, and `img-src` and
      `media-src` stay closed anyway — that is the entire point of the design.
      The sanitiser rewrites every remote URL to a bridge endpoint, and the
      bridge fetches it server-side and streams it back, so the browser only
      ever asks localhost for bytes. Opening these to https: would defeat that
      and hand the beacon straight back. If a thumbnail arrives blank, the
      bridge could not fetch it; it is not this policy.

      `frame-src` is the one exception, and it is one because there is no
      alternative: YouTube and Vimeo will not hand over the media file, so an
      iframe is the only way to play a video result inline. Three hosts, and the
      sanitiser pins the paths within them as well — any other frame is removed
      from the markup before it reaches the DOM, so this line is the second lock
      rather than the only one.

      The bridge itself is framed too, and that is what makes blades work. A
      publisher's X-Frame-Options is a rule enforced against the browser, so an
      article can never be framed from here directly. The bridge fetches it
      server-side and serves it back from localhost:8787, at which point the
      document is ours and there is nothing cross-origin to refuse. Note what is
      NOT relaxed: no publisher's own origin appears here, so only pages that
      have been through the bridge — script-stripped, served under their own
      tight CSP, and sandboxed at the iframe — can be framed at all.

      The rest is loose on purpose, because the voice stack needs it:
      'wasm-unsafe-eval' and 'unsafe-eval' for the ONNX runtime and the inline
      espeak-ng WASM, blob: workers for the wake-word engine and the speech
      model, ws: for both the bridge and Vite's HMR socket, https: for the
      model download and the speech API, and 'unsafe-inline' scripts for the
      React Fast Refresh preamble Vite injects in dev.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com http://localhost:8787 http://127.0.0.1:8787;
        img-src 'self' data: blob: http://localhost:8787 http://127.0.0.1:8787;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' data: https://fonts.gstatic.com;
        connect-src 'self' data: blob: https: ws: wss: http://localhost:8787 http://127.0.0.1:8787;
        worker-src 'self' blob:;
        media-src 'self' data: blob: http://localhost:8787 http://127.0.0.1:8787;
      "
    />

    <title>MORPHEUS</title>
  </head>
  <body>
    <!--
      The placeholder is the floor of the diagnostic stack.

      CrashGuard catches a render that throws, but it can only catch what
      React is alive to see. If a module fails to parse or fetch, main.tsx
      never runs, React never mounts, no boundary exists, and #root stays
      exactly as the server sent it -- an empty div on a dark page, which is
      indistinguishable from a hung boot.

      So #root ships with words in it. Seeing them means the document loaded
      and the script did not. React replaces them the moment it mounts, so
      they cost nothing when things work.
    -->
    <div id="root">
      <div id="boot-fallback" style="
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 10px;
        background: #05080b; color: #6f8fa0;
        font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
        letter-spacing: 0.18em; text-align: center; padding: 24px;
      ">
        <div>LOADING MORPHEUS</div>
        <div style="opacity: 0.6; letter-spacing: 0.08em">
          if this does not clear, the interface script failed to load
        </div>
        <pre id="boot-error" style="
          display: none; max-width: 90vw; max-height: 60vh; overflow: auto;
          margin: 8px 0 0; padding: 12px; text-align: left;
          white-space: pre-wrap; word-break: break-word;
          background: rgba(255, 107, 107, 0.06);
          border: 1px solid rgba(255, 107, 107, 0.25);
          color: #ffb3b3; letter-spacing: 0; font-size: 11px;
        "></pre>
      </div>
    </div>

    <!--
      Registered before the module so it is already listening while the module
      loads. A failed import fires `error` on window with no React anywhere.
    -->
    <script>
      (function () {
        function show(what) {
          var box = document.getElementById('boot-error')
          if (!box) return
          box.style.display = 'block'
          box.textContent = String(box.textContent || '') + what + '\n'
        }
        window.addEventListener('error', function (e) {
          show(
            e.message +
              (e.filename ? '\n  at ' + e.filename + ':' + (e.lineno || '?') : ''),
          )
        })
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          show('unhandled rejection: ' + ((r && (r.stack || r.message)) || r))
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
